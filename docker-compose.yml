services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  logpilot:
    build: .
    ports:
      - "8080:8080"
    environment:
      LOGPILOT_HTTP_ADDR: :8080
      LOGPILOT_DATABASE_PATH: /app/data/logpilot.db
      LOGPILOT_LLM_BASE_URL: ${LOGPILOT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      LOGPILOT_LLM_API_KEY: ${LOGPILOT_LLM_API_KEY:?set LOGPILOT_LLM_API_KEY in the shell}
      LOGPILOT_LLM_MODEL: ${LOGPILOT_LLM_MODEL:-deepseek-flash}
      LOGPILOT_EMBED_DIMENSION: "384"
      LOGPILOT_QDRANT_URL: http://qdrant:6333
    volumes:
      - logpilot-data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant-data:
  logpilot-data:
